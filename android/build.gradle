buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Update to a newer AGP version that supports compileSdk 35+
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    // Update to API 35 (Vanilla Ice Cream / Android 15)
    compileSdkVersion = 35
    minSdkVersion = 30
    targetSdkVersion = 35
    
    junitVersion = '4.13.2'
    androidxAppCompatVersion = '1.7.1'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    coreSplashScreenVersion = '1.0.1'
}